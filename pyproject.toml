# SPDX-License-Identifier: Apache-2.0

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemo-relay-spraay"
version = "1.0.0"
license = "Apache-2.0"
description = "NeMo Relay gRPC worker plugin for Spraay batch payment transactions"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Plagtech", email = "mngoswp@gmail.com" }]
dependencies = [
  # The manifest declares the grpc-v1 protocol, which published 0.x releases speak.
  "nemo-relay-plugin>=0.11.1,<1.0",
  "httpx>=0.27",
]

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.26",
  "pytest-httpx>=0.35",
  "ruff>=0.8",
]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nemo_relay_spraay"]

[tool.ruff]
line-length = 120
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
