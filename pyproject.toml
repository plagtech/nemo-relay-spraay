# SPDX-License-Identifier: Apache-2.0

[project]
name = "nemo-relay-spraay"
version = "0.1.0"
description = "NeMo Relay plugin that builds unsigned multi-recipient batch transactions through the Spraay gateway."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "plagtech", email = "mngoswp@gmail.com" }]
dependencies = [
  "httpx>=0.27",
  "nemo-relay>=0.11.1",
]

[dependency-groups]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.26",
  "ruff>=0.8",
]
# Only for scripts/live_execute_proof.py and examples/x402_payment_hook.py.
# The plugin itself never imports these and never holds a key.
live = [
  "x402[evm]>=2.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_relay_spraay"]

[tool.uv]
default-groups = ["test"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
