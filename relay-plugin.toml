manifest_version = 1

[plugin]
id = "plagtech.spraay_batch"
kind = "worker"

[compat]
relay = ">=0.11.0,<1.0"
worker_protocol = "grpc-v1"

[defaults]
enabled = false

[capabilities]
items = ["plugin_worker", "config_schema"]

[config_schema]
path = "config.schema.json"

[source]
manifest_root = "."
artifact = "nemo_relay_spraay/worker.py"

[integrity]
sha256 = "sha256:44140c6c474b39588f9a3dc8249af59970aa0753716e993f6f0c75f65b224adc"

[load]
runtime = "python"
entrypoint = "nemo_relay_spraay.worker:main"
